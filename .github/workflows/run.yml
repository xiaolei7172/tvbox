name: Update sources

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
  push:
    branches:
      - master
    paths:
      - "tools/**"

# 同一时间只允许一个更新任务，避免并发提交互相覆盖
concurrency:
  group: update-sources
  cancel-in-progress: true

# 显式声明写入权限：新仓库默认 token 为只读，否则 push 会 403
permissions:
  contents: write

jobs:
  xiaosa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install demjson3 pycryptodome requests

      - name: Build xiaosa
        working-directory: tools
        run: |
          set -e
          python tvbox.py https://9877.kstore.space/sun.json xs.json dec
          python build_local.py xs.json output
          cp -pdr output/* ../xiaosa/
          python xiao.py ./output/api.json dianshi.json
          python xiao.py ./output/api.json jsm.json
          python copy_xbpq.py ./output/api.json
          cp -pdr dianshi_with_app_sites.json ../dianshi.json
          cp -pdr jsm_with_app_sites.json ../jsm.json
          cp -pdr ./output/spider.jar ../jar/spider.jar
          rm -rf dianshi_with_app_sites.json jsm_with_app_sites.json output xs.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaosa-output
          path: |
            dianshi.json
            jsm.json
            jar/spider.jar
            xiaosa/
            XBPQ/
            XYQHiker/
            json/
            py/
            js/
          retention-days: 3

  fty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install demjson3 pycryptodome requests

      - name: Build fty
        working-directory: tools
        run: |
          set -e
          python tvbox.py https://www.xn--sss604efuw.net/tv ty.json dec
          python fty.py ty.json
          cp -pdr tvbox_cleaned.json ../fty.json
          cp -pdr fan.txt ../jar/fan.txt
          git clone --depth=1 --recursive https://github.com/fantaiying7/EXT.git
          cp -pdr EXT/* ../FTY/
          rm -rf tvbox_cleaned.json fan.txt EXT ty.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fty-output
          path: |
            fty.json
            jar/fan.txt
            FTY/
          retention-days: 3

  verify-and-push:
    needs: [xiaosa, fty]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download xiaosa artifacts
        uses: actions/download-artifact@v8
        with:
          name: xiaosa-output
        continue-on-error: true

      - name: Download fty artifacts
        uses: actions/download-artifact@v8
        with:
          name: fty-output
        continue-on-error: true

      # 刷新 wmz 外部源：配置与配套 jar 同步升级。
      # 任何一步失败都保留原快照，不让仓库进入半更新状态。
      - name: Refresh wmz source
        run: python tools/refresh_wmz.py || echo "::warning::wmz 源刷新失败，沿用现有快照"

      # 重新生成合并配置：jar 若被上游更新，白名单会自动跟着 dex 重新提取
      - name: Merge config
        run: python tools/merge_config.py

      # 提交前自检：spider MD5、JSON 合法性、本地引用完整性。
      # 发现 P0 问题则中止，不把坏数据推上去。
      - name: Health check
        id: health
        run: |
          python tools/check_health.py --no-secret --json > /tmp/health.json || true
          python - <<'PY'
          import json, sys
          r = json.load(open("/tmp/health.json", encoding="utf-8"))
          p0 = r.get("p0", [])
          print("P0:", p0 or "无")
          if p0:
              print("::warning::体检发现 P0 问题，已阻止提交")
              sys.exit(1)
          PY

      - name: Commit and push
        if: steps.health.outcome == 'success'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "无文件变更，跳过提交"
            exit 0
          fi
          git commit -m "更新源 $(date +%Y%m%d%H%M)"
          # 先 rebase 再推送，避免强推抹掉手动提交
          git pull --rebase --autostash origin master
          git push origin master

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::自动更新失败，请检查上游源是否可用"
          echo "  https://9877.kstore.space/sun.json"
          echo "  https://www.xn--sss604efuw.net/tv"
